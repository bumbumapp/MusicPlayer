apply plugin: "com.android.application"
apply plugin: "kotlin-android"
apply plugin: "kotlin-kapt"
apply plugin: "androidx.navigation.safeargs.kotlin"
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

android {
    namespace 'org.bumbumapps.musicplayer'
    compileSdk 36

    defaultConfig {
        applicationId "org.bumbumapps.musicplayer"
        versionName "2.4.0"
        versionCode 12

        minSdk 24 // play-services-ads 25 requires 24
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        dataBinding true
        buildConfig true
        resValues true
    }

    buildTypes {
        debug {
            debuggable true
            // Google sample IDs: debug builds never request live ads.
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            resValue "string", "admob_interstitial_id", "ca-app-pub-3940256099942544/1033173712"
        }

        release {
            manifestPlaceholders = [admobAppId: "ca-app-pub-8444865753152507~6932205868"]
            resValue "string", "admob_interstitial_id", "ca-app-pub-8444865753152507/4732066868"
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += "-Xjvm-default=all"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.activity:activity-ktx:1.11.0"
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation "androidx.appcompat:appcompat:1.7.1"

    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.dynamicanimation:dynamicanimation:1.1.0"
    implementation "androidx.viewpager2:viewpager2:1.1.0"

    def lifecycle_version = "2.9.4"
    implementation "androidx.lifecycle:lifecycle-common:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"

    implementation "androidx.navigation:navigation-ui-ktx:$navigation_version"
    implementation "androidx.navigation:navigation-fragment-ktx:$navigation_version"

    implementation "androidx.media:media:1.7.1"
    implementation "androidx.preference:preference-ktx:1.2.1"

    implementation "com.google.android.exoplayer:exoplayer-core:2.19.1"

    implementation 'io.coil-kt:coil:2.7.0'

    implementation 'com.google.android.material:material:1.13.0'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
